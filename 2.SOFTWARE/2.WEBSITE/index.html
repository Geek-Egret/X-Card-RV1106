<style>
:root {
  --gap: 24px;
  --content-gap: 20px;
  --nav-width: 1024px;
  --main-width: 720px;
  --header-height: 60px;
  --footer-height: 78px;
  --radius: 8px;
}
:root {
  --theme: transparent;
  --entry: rgba(255, 255, 255, 0.07);
  --primary: rgba(255, 255, 255, 0.92);
  --secondary: rgba(255, 255, 255, 0.6);
  --tertiary: rgba(255, 255, 255, 0.1);
  --content: rgba(255, 255, 255, 0.78);
  --code-block-bg: rgba(255, 255, 255, 0.12);
  --code-bg: rgba(255, 255, 255, 0.08);
  --border: rgba(255, 255, 255, 0.22);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --theme: transparent;
    --entry: rgba(255, 255, 255, 0.07);
    --primary: rgba(255, 255, 255, 0.92);
    --secondary: rgba(255, 255, 255, 0.6);
    --tertiary: rgba(255, 255, 255, 0.1);
    --content: rgba(255, 255, 255, 0.78);
    --code-block-bg: rgba(255, 255, 255, 0.12);
    --code-bg: rgba(255, 255, 255, 0.08);
    --border: rgba(255, 255, 255, 0.22);
    color-scheme: dark;
  }
}
:root.dark {
  --theme: transparent;
  --entry: rgba(255, 255, 255, 0.07);
  --primary: rgba(255, 255, 255, 0.92);
  --secondary: rgba(255, 255, 255, 0.6);
  --tertiary: rgba(255, 255, 255, 0.1);
  --content: rgba(255, 255, 255, 0.78);
  --code-block-bg: rgba(255, 255, 255, 0.12);
  --code-bg: rgba(255, 255, 255, 0.08);
  --border: rgba(255, 255, 255, 0.22);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; background: var(--theme); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  font-size: 16px;
  line-height: 1.6;
  color: var(--primary);
  background: transparent;
  transition: background-color .3s ease, color .3s ease;
  min-height: 100vh;
}

body, .main, .footer, .header, .nav, .logo, #menu, .social-icons, .top-link {
  transition: background-color .3s ease, color .3s ease, border-color .3s ease, box-shadow .3s ease;
}

a { color: var(--primary); text-decoration: none; transition: color .2s ease; }
a:hover { color: #1a73e8; text-decoration: underline; }

/* Header */
.header { max-width: var(--nav-width); margin: 0 auto; padding: 0 var(--gap); height: var(--header-height); display: flex; align-items: center; position: sticky; top: 0; z-index: 10; background: var(--theme); }
.nav { display: flex; align-items: center; justify-content: space-between; width: 100%; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 8px; }
.logo a { font-size: 1.3em; font-weight: 700; color: var(--primary); text-decoration: none; }
.logo a:hover { color: #1a73e8; }

#menu { display: flex; list-style: none; gap: 4px; overflow-x: auto; padding: 0; }
#menu li a {
  display: block; padding: 6px 14px; border-radius: var(--radius);
  color: var(--secondary); font-size: .95em; font-weight: 500; text-decoration: none;
  transition: all .2s ease; white-space: nowrap;
}
#menu li a:hover, #menu li a.active { color: #fff; background: rgba(26, 115, 232, 0.2); box-shadow: 0 0 12px rgba(26, 115, 232, 0.2); text-decoration: none; }

/* Main */
.main { max-width: var(--main-width); margin: 0 auto; padding: var(--gap); min-height: calc(100vh - var(--header-height) - var(--footer-height) - 40px); }

/* Profile */
.profile { margin-top: 40px; }
.profile_inner { text-align: center; padding: 40px var(--gap); background: var(--entry); border-radius: var(--radius); border: 1px solid var(--border); }
.profile_inner img {
  width: 150px; height: auto; margin-bottom: 20px;
  transition: transform .3s ease;
}
.profile_inner img:hover { transform: scale(1.05); }
.profile_inner h1 { font-size: 2em; margin-bottom: 8px; font-weight: 700; }
.profile_inner span { color: var(--secondary); font-size: 1.05em; display: block; margin-bottom: 24px; }

.social-icons { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
.social-icons a {
  display: flex; align-items: center; justify-content: center;
  width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--border); color: var(--secondary);
  transition: all .2s ease;
}
.social-icons a:hover { color: #1a73e8; border-color: #1a73e8; box-shadow: 0 0 12px rgba(26, 115, 232, 0.25); transform: translateY(-2px); text-decoration: none; }
.social-icons svg { width: 20px; height: 20px; }

/* Posts section */
.posts-section { margin-top: 40px; }
.posts-section h2 { font-size: 1.5em; margin-bottom: 20px; color: var(--primary); }
.entry-list { display: flex; flex-direction: column; gap: 12px; }
.entry-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px; background: var(--entry); border-radius: var(--radius);
  border: 1px solid var(--border); transition: all .2s ease;
}
.entry-item:hover { border-color: #1a73e8; box-shadow: 0 0 16px rgba(26, 115, 232, 0.15); transform: translateX(4px); }
.entry-item .entry-title { font-weight: 600; color: var(--primary); }
.entry-item .entry-date { color: var(--secondary); font-size: .85em; white-space: nowrap; margin-left: 12px; }
.entry-item .entry-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.entry-item .entry-tags span {
  font-size: .75em; padding: 2px 8px; background: var(--tertiary);
  border-radius: 4px; color: var(--secondary);
}

/* Footer */
.footer { max-width: var(--main-width); margin: 0 auto; padding: 20px var(--gap); text-align: center; color: var(--secondary); font-size: .85em; border-top: 1px solid var(--border); }
.footer a { color: var(--secondary); }
.footer a:hover { color: #1a73e8; }
.footer span { display: block; }
.footer span + span { margin-top: 4px; }

/* Top link */
.top-link {
  visibility: hidden; opacity: 0; position: fixed; bottom: 30px; right: 30px;
  width: 40px; height: 40px; border-radius: 50%; background: var(--entry);
  border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 99; transition: all .3s ease;
}
.top-link:hover { border-color: #1a73e8; box-shadow: 0 0 10px rgba(26, 115, 232, 0.2); }
.top-link svg { width: 18px; height: 18px; fill: var(--secondary); }
.top-link.visible { visibility: visible; opacity: 1; }

/* Page content */
.page-content { max-width: 720px; margin: 0 auto; padding: 40px var(--gap); }
.page-content h1 { font-size: 2em; margin-bottom: 16px; }
.page-content h2 { font-size: 1.4em; margin: 28px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.page-content p { margin-bottom: 12px; color: var(--content); }
.page-content ul { padding-left: 20px; margin-bottom: 12px; }
.page-content li { color: var(--content); margin-bottom: 4px; }
.page-content .back-link { display: inline-block; margin-top: 24px; padding: 8px 16px; background: var(--entry); border: 1px solid var(--border); border-radius: var(--radius); font-size: .9em; }
.page-content .back-link:hover { border-color: #1a73e8; box-shadow: 0 0 10px rgba(26, 115, 232, 0.2); text-decoration: none; }

/* Markdown rendered content */
.page-content blockquote {
  border-left: 3px solid #1a73e8; padding: 8px 16px; margin: 12px 0;
  background: var(--entry); border-radius: 0 var(--radius) var(--radius) 0;
  color: var(--secondary);
}
.page-content hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
.page-content img { max-width: 100%; border-radius: var(--radius); }
.page-content ol { padding-left: 20px; margin-bottom: 12px; }
.page-content ol li { color: var(--content); margin-bottom: 4px; }
.page-content table { width: 100%; border-collapse: collapse; margin: 16px 0; }
.page-content th, .page-content td {
  border: 1px solid var(--border); padding: 8px 12px; text-align: left; font-size: .9em;
}
.page-content th { background: var(--entry); font-weight: 600; color: var(--primary); }
.page-content td { color: var(--content); }
.page-content code {
  background: var(--code-bg); padding: 2px 6px; border-radius: 4px;
  font-size: .9em; font-family: "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
.page-content pre {
  background: var(--code-block-bg); color: #e0e0e0; padding: 16px; border-radius: var(--radius);
  overflow-x: auto; margin-bottom: 16px; font-size: .9em; line-height: 1.5;
}
.page-content pre code { background: none; padding: 0; color: inherit; }

/* Tags cloud */
.tags-cloud { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.tag-item { padding: 6px 16px; background: var(--entry); border: 1px solid var(--border); border-radius: var(--radius); font-size: .9em; color: var(--secondary); transition: all .2s ease; cursor: pointer; }
.tag-item:hover, .tag-item.active { border-color: #1a73e8; color: #1a73e8; box-shadow: 0 0 10px rgba(26, 115, 232, 0.2); transform: translateY(-1px); }

/* Responsive */
@media (max-width: 600px) {
  .nav { flex-direction: column; gap: 10px; }
  .header { height: auto; padding: 12px var(--gap); }
  .profile_inner { padding: 30px 16px; }
  .profile_inner h1 { font-size: 1.6em; }
  .entry-item { flex-direction: column; align-items: flex-start; gap: 6px; }
  .entry-item .entry-date { margin-left: 0; }
}

/* Project cards */
.project-grid {
  display: flex; flex-direction: column; gap: 16px; margin-top: 24px;
}
.project-card {
  background: var(--entry); border-radius: var(--radius);
  border: 1px solid var(--border); overflow: hidden;
  transition: all .3s ease; cursor: pointer; display: flex; align-items: stretch;
  text-decoration: none; color: inherit;
}
.project-card:hover {
  border-color: #1a73e8; transform: translateX(4px);
  box-shadow: 0 0 20px rgba(26, 115, 232, 0.2);
  text-decoration: none;
}
.project-card .card-img {
  width: 200px; min-height: 140px; object-fit: cover; display: block; flex-shrink: 0;
  background: var(--tertiary);
}
.project-card .card-img-placeholder {
  width: 160px; min-height: 140px; display: flex; align-items: center;
  justify-content: center; background: var(--tertiary); flex-shrink: 0;
  font-size: 2.5em; color: var(--secondary);
}
.project-card .card-body { padding: 16px 20px; }
.project-card .card-body h3 { font-size: 1.15em; margin-bottom: 6px; color: var(--primary); }
.project-card .card-body p { font-size: .9em; color: var(--secondary); margin-bottom: 10px; line-height: 1.5; }
.project-card .card-body .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.project-card .card-body .card-tags span {
  font-size: .72em; padding: 2px 8px; background: var(--tertiary);
  border-radius: 4px; color: var(--secondary);
}

/* Project detail page */
.project-detail { max-width: 800px; margin: 0 auto; padding: 40px var(--gap); }
.project-detail h1 { font-size: 2em; margin-bottom: 8px; }
.project-detail .detail-meta { color: var(--secondary); font-size: .9em; margin-bottom: 20px; }
.project-detail .detail-img {
  width: 100%; max-height: 400px; object-fit: cover; border-radius: var(--radius);
  margin-bottom: 24px; border: 1px solid var(--border);
}
.project-detail .detail-img-placeholder {
  width: 100%; height: 260px; display: flex; align-items: center;
  justify-content: center; background: var(--tertiary); border-radius: var(--radius);
  font-size: 4em; color: var(--secondary); margin-bottom: 24px;
  border: 1px solid var(--border);
}
.project-detail h2 { font-size: 1.3em; margin: 24px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.project-detail p { margin-bottom: 12px; color: var(--content); line-height: 1.7; }
.project-detail ul, .project-detail ol { padding-left: 20px; margin-bottom: 12px; }
.project-detail li { color: var(--content); margin-bottom: 4px; line-height: 1.6; }
.project-detail .back-link { display: inline-block; margin-top: 24px; padding: 8px 16px; background: var(--entry); border: 1px solid var(--border); border-radius: var(--radius); font-size: .9em; }
.project-detail .back-link:hover { border-color: #1a73e8; box-shadow: 0 0 10px rgba(26, 115, 232, 0.2); text-decoration: none; }
.project-detail .detail-imgs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 16px 0; }
.project-detail .detail-imgs img {
  width: 100%; height: 180px; object-fit: cover; border-radius: var(--radius);
  border: 1px solid var(--border);
}
.project-detail .detail-imgs .detail-imgs-placeholder {
  width: 100%; height: 180px; display: flex; align-items: center;
  justify-content: center; background: var(--tertiary); border-radius: var(--radius);
  font-size: 2.5em; color: var(--secondary); border: 1px solid var(--border);
}
.project-detail code {
  background: var(--code-bg); padding: 2px 6px; border-radius: 4px;
  font-size: .9em; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}
.project-detail pre {
  background: var(--code-block-bg); color: #e0e0e0; padding: 16px; border-radius: var(--radius);
  overflow-x: auto; margin-bottom: 16px; font-size: .9em; line-height: 1.5;
}
.project-detail pre code { background: none; padding: 0; color: inherit; }

/* Splash screen */
#splash {
  position: fixed; inset: 0; z-index: 9999;
  background: #0a0a12;
  display: flex; align-items: center; justify-content: center;
  transition: opacity .6s ease, visibility .6s ease;
}
#splash.fade-out { opacity: 0; visibility: hidden; }
#splash img { width: 220px; height: auto; }

/* Animation */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.profile_inner { animation: fadeIn .6s ease; }
.entry-item { animation: fadeIn .6s ease; }
.project-card { animation: fadeIn .6s ease; }

/* Responsive for project grid */
@media (max-width: 640px) {
  .project-card { flex-direction: column; }
  .project-card .card-img-placeholder,
  .project-card .card-img { width: 100%; height: 160px; min-height: auto; }
  .project-detail .detail-imgs { grid-template-columns: 1fr; }
}
</style>

<script>
// ====== Load & apply param.json ======
window.__P = null;
window.__P_ready = new Promise(function(resolve) {
  var url = '/param.json?t=' + Date.now();
  fetch(url)
    .then(function(r) { if (!r.ok) throw Error('no param.json'); return r.json(); })
    .then(function(p) {
      window.__P = p;
      // Meta
      if (p.meta) {
        document.title = p.meta.title || document.title;
        var logo = document.querySelector('.logo a');
        if (logo && p.meta.title) { logo.textContent = p.meta.title; logo.setAttribute('title', p.meta.title); }
        var setMeta = function(n, v) {
          var el = document.querySelector('meta[name="' + n + '"]');
          if (el) el.setAttribute('content', v || '');
          else { el = document.querySelector('meta[property="' + n + '"]'); if (el) el.setAttribute('content', v || ''); }
        };
        setMeta('keywords', p.meta.keywords);
        setMeta('description', p.meta.description);
        setMeta('author', p.meta.author);
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc && p.meta.themeColor) tc.setAttribute('content', p.meta.themeColor);
      }
      // Nav
      if (p.nav && p.nav.length) {
        var menu = document.getElementById('menu');
        if (menu) {
          var navHtml = '';
          for (var i = 0; i < p.nav.length; i++) {
            var item = p.nav[i];
            navHtml += '<li><a href="' + item.href + '" title="' + item.label + '"><span>' + item.label + '</span></a></li>';
          }
          menu.innerHTML = navHtml;
          // Re-highlight current page
          var curPath = window.location.pathname.replace(/\/$/, '') || '/';
          if (curPath === '/index.html') curPath = '/';
          document.querySelectorAll('#menu a').forEach(function(a) {
            a.classList.toggle('active', a.getAttribute('href') === curPath);
          });
        }
      }
      // Profile
      if (p.profile) {
        var avatar = document.querySelector('.profile_inner img');
        if (avatar && p.profile.avatar) { avatar.src = p.profile.avatar; avatar.alt = p.profile.name || ''; }
        var nameEl = document.querySelector('.profile_inner h1');
        if (nameEl && p.profile.name) nameEl.textContent = p.profile.name;
        var tagEl = document.querySelector('.profile_inner span');
        if (tagEl && p.profile.tagline) tagEl.textContent = p.profile.tagline;
      }
      // Social links
      if (p.social) {
        var icons = document.querySelectorAll('.social-icons a');
        var keys = ['github', 'bilibili', 'taobao', 'email'];
        for (var i = 0; i < icons.length && i < keys.length; i++) {
          if (p.social[keys[i]]) icons[i].setAttribute('href', p.social[keys[i]]);
        }
      }
      // Footer
      if (p.footer) {
        var ft = document.querySelector('.footer span:last-child');
        if (ft && p.footer.poweredBy) ft.innerHTML = p.footer.poweredBy;
      }
      // Home section title
      if (p.pages && p.pages.home && p.pages.home.sectionTitle) {
        var st = document.querySelector('.posts-section h2');
        if (st) st.textContent = p.pages.home.sectionTitle;
      }
      resolve();
    })
    .catch(function() {
      window.__P = null;
      resolve();
    });
});
</script>

<script>
(function() {
  // Splash screen — only on first visit
  var splash = document.getElementById('splash');
  var html = document.documentElement;
  var hasVisited = sessionStorage.getItem('visited');

  var p = (window.__P && window.__P.splash) || {};
  if (p.enabled === false) { if (splash.parentNode) splash.parentNode.removeChild(splash); return; }

  // Set splash background to match theme
  var stored = localStorage.getItem('pref-theme');
  var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (hasVisited) {
    // Already visited this session, remove splash immediately
    splash.parentNode.removeChild(splash);
  } else {
    sessionStorage.setItem('visited', '1');
    var duration = p.duration || 1500;
    // Fade out splash after page loads
    var fadeOut = function() {
      splash.classList.add('fade-out');
      setTimeout(function() {
        if (splash.parentNode) splash.parentNode.removeChild(splash);
      }, 700);
    };

    var loaded = false;
    window.addEventListener('load', function() { loaded = true; });
    setTimeout(function() {
      if (!loaded) window.addEventListener('load', fadeOut);
      fadeOut();
    }, duration);

    splash.addEventListener('click', fadeOut);
  }

  // Init theme based on system preference
  (function() {
    var stored = localStorage.getItem('pref-theme');
    var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.classList.add('dark');
  })();

  // Particle canvas background
   (function() {
    var pp = (window.__P && window.__P.particles) || {};
    if (pp.enabled === false) return;
    var canvas = document.createElement('canvas');
    canvas.id = 'particles';
    var blurPx = pp.blur != null ? pp.blur : 1.5;
    canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;filter:blur(' + blurPx + 'px)';
    canvas.style.background = 'radial-gradient(ellipse at 30% 40%, rgba(20,30,80,0.3) 0%, transparent 60%), radial-gradient(ellipse at 70% 60%, rgba(15,10,40,0.25) 0%, transparent 50%)';
    document.body.insertBefore(canvas, document.body.firstChild);
    var ctx = canvas.getContext('2d');
    var stars = [];
    var w, h, time = 0;
    var density = pp.densityDivisor || 2200;
    var maxStars = pp.maxStars || 500;

    function createStar() {
      var rnd = Math.random();
      var s = { x: Math.random() * w, y: Math.random() * h, phase: Math.random() * Math.PI * 2 };
      if (rnd < 0.7) {
        // Tiny dim stars
        s.r = Math.random() * 0.7 + 0.2;
        s.baseAlpha = Math.random() * 0.18 + 0.04;
        s.vx = (Math.random() - 0.5) * 0.06;
        s.vy = Math.random() * 0.04 + 0.01;
        s.twinkle = Math.random() * 0.4 + 0.3;
        s.color = [255, 255, 255];
      } else if (rnd < 0.92) {
        // Medium stars with subtle color
        s.r = Math.random() * 1 + 0.4;
        s.baseAlpha = Math.random() * 0.3 + 0.2;
        s.vx = (Math.random() - 0.5) * 0.1;
        s.vy = Math.random() * 0.07 + 0.02;
        s.twinkle = Math.random() * 0.7 + 0.5;
        var tint = Math.random();
        if (tint < 0.65) s.color = [255, 250, 245];
        else if (tint < 0.82) s.color = [210, 225, 255];
        else if (tint < 0.94) s.color = [200, 210, 255];
        else s.color = [255, 220, 180];
      } else {
        // Bright glowing stars
        s.r = Math.random() * 1.8 + 1;
        s.baseAlpha = Math.random() * 0.25 + 0.5;
        s.vx = (Math.random() - 0.5) * 0.08;
        s.vy = Math.random() * 0.05 + 0.01;
        s.twinkle = Math.random() * 1 + 0.8;
        s.color = [255, 252, 248];
        s.glow = true;
      }
      return s;
    }

    function resize() {
      var oldW = w, oldH = h;
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      if (oldW && oldH) {
        var sx = w / oldW, sy = h / oldH;
        for (var i = 0; i < stars.length; i++) {
          stars[i].x = Math.min(Math.max(stars[i].x * sx, 0), w);
          stars[i].y = Math.min(Math.max(stars[i].y * sy, 0), h);
        }
      }
      var target = Math.min(maxStars, Math.floor((w * h) / density));
      while (stars.length < target) stars.push(createStar());
      while (stars.length > target) stars.pop();
    }
    resize();
    window.addEventListener('resize', resize);

    function draw() {
      ctx.clearRect(0, 0, w, h);
      time += 0.008;

      // Glow halos for bright stars
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        if (!s.glow) continue;
        var a = s.baseAlpha + Math.sin(time * s.twinkle + s.phase) * 0.15;
        a = Math.max(0, Math.min(a, 0.85));
        var glowR = s.r * 6;
        var grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, glowR);
        grad.addColorStop(0, 'rgba(' + s.color.join(',') + ',' + a + ')');
        grad.addColorStop(0.25, 'rgba(' + s.color.join(',') + ',' + (a * 0.3) + ')');
        grad.addColorStop(1, 'rgba(' + s.color.join(',') + ',0)');
        ctx.fillStyle = grad;
        ctx.fillRect(s.x - glowR, s.y - glowR, glowR * 2, glowR * 2);
      }

      // Draw stars
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var a = s.baseAlpha + Math.sin(time * s.twinkle + s.phase) * 0.06;
        a = Math.max(0.015, Math.min(a, 0.92));

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + s.color.join(',') + ',' + a + ')';
        ctx.fill();

        // Cross flare for brightest stars
        if (s.glow && a > 0.5) {
          ctx.strokeStyle = 'rgba(' + s.color.join(',') + ',' + (a * 0.35) + ')';
          ctx.lineWidth = 0.4;
          var fl = s.r * 4;
          ctx.beginPath();
          ctx.moveTo(s.x - fl, s.y); ctx.lineTo(s.x + fl, s.y);
          ctx.moveTo(s.x, s.y - fl); ctx.lineTo(s.x, s.y + fl);
          ctx.stroke();
        }

        // Drift
        s.x += s.vx;
        s.y += s.vy;
        if (s.x < -20) s.x = w + 20;
        if (s.x > w + 20) s.x = -20;
        if (s.y < -20) s.y = h + 20;
        if (s.y > h + 20) s.y = -20;
      }

      requestAnimationFrame(draw);
    }
    draw();
  })();

  // Top link
  var topLink = document.getElementById('top-link');
  window.onscroll = function() {
    var scrollY = document.documentElement.scrollTop || document.body.scrollTop;
    if (scrollY > 800) {
      topLink.classList.add('visible');
    } else {
      topLink.classList.remove('visible');
    }
  };

  // Menu scroll position persistence
  var menu = document.getElementById('menu');
  if (menu) {
    var saved = sessionStorage.getItem('menu-scroll-position');
    if (saved) menu.scrollLeft = parseInt(saved, 10);
    menu.addEventListener('scroll', function() {
      sessionStorage.setItem('menu-scroll-position', menu.scrollLeft);
    });
  }
})();
</script>

<script>
// Markdown parser (renders .md files to HTML)
function parseMarkdown(md) {
  var lines = md.split('\n');
  var out = [];
  var inCode = false;
  var codeBuf = [];
  var listType = null;
  var i = 0;

  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function inline(s) {
    s = esc(s);
    s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
    s = s.replace(/~~(.+?)~~/g, '<del>$1</del>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    return s;
  }

  function closeList() {
    if (listType) { out.push('</' + listType + '>'); listType = null; }
  }

  while (i < lines.length) {
    var line = lines[i];

    if (/^```/.test(line)) {
      closeList();
      if (inCode) {
        out.push('<pre><code>' + codeBuf.join('\n') + '</code></pre>');
        codeBuf = [];
        inCode = false;
      } else {
        inCode = true;
      }
      i++;
      continue;
    }

    if (inCode) {
      codeBuf.push(esc(line));
      i++;
      continue;
    }

    var t = line.trim();
    if (!t) { closeList(); out.push(''); i++; continue; }

    // Skip metadata lines in .md files
    if (/^tags:/i.test(t)) { i++; continue; }

    var h = t.match(/^(#{1,4})\s+(.+)/);
    if (h) { closeList(); out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'); i++; continue; }

    if (/^---$/.test(t)) { closeList(); out.push('<hr>'); i++; continue; }

    if (/^>\s/.test(t)) { closeList(); out.push('<blockquote>' + inline(t.replace(/^>\s*/, '')) + '</blockquote>'); i++; continue; }

    if (/^[-*]\s/.test(t)) {
      if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; }
      out.push('<li>' + inline(t.replace(/^[-*]\s+/, '')) + '</li>');
      i++; continue;
    }

    if (/^\d+\.\s/.test(t)) {
      if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; }
      out.push('<li>' + inline(t.replace(/^\d+\.\s+/, '')) + '</li>');
      i++; continue;
    }

    // Table (protects inline code from | splitting)
    if (/^\|.+\|$/.test(t)) {
      closeList();
      var isHeader = i + 1 < lines.length && /^\|[\s\-:\|]+\|$/.test(lines[i + 1].trim());
      if (isHeader) {
        function splitCells(line) {
          var placeholders = [];
          var safe = line.replace(/`([^`]+)`/g, function(m, c) {
            placeholders.push('`' + c + '`');
            return '\x00' + (placeholders.length - 1) + '\x00';
          });
          safe = safe.replace(/\\\|/g, function() {
            placeholders.push('|');
            return '\x00' + (placeholders.length - 1) + '\x00';
          });
          var cells = safe.split('|').filter(function(c) { return c.trim(); });
          return cells.map(function(c) {
            return c.trim().replace(/\x00(\d+)\x00/g, function(_, n) {
              return placeholders[parseInt(n)];
            });
          });
        }
        var cols = splitCells(t);
        out.push('<table><thead><tr>' + cols.map(function(c) { return '<th>' + inline(c) + '</th>'; }).join('') + '</tr></thead><tbody>');
        i += 2;
        while (i < lines.length && /^\|.+\|$/.test(lines[i].trim())) {
          var cells = splitCells(lines[i].trim());
          out.push('<tr>' + cells.map(function(c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>');
          i++;
        }
        out.push('</tbody></table>');
        continue;
      }
    }

    closeList();
    out.push('<p>' + inline(t) + '</p>');
    i++;
  }
  closeList();
  if (inCode) { out.push('<pre><code>' + codeBuf.join('\n') + '</code></pre>'); }
  return out.join('\n');
}

// ========== Dynamic article system ==========

var articleMetaCache = {};
var META_CACHE_VER = 'v2';

function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function extractTitleFromMd(text) {
  var m = text.match(/^#\s+(.+)/m);
  return m ? m[1].trim() : null;
}

function extractTitleFromHtml(text) {
  var m = text.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i);
  return m ? m[1].replace(/<[^>]+>/g, '').trim() : null;
}

function extractTagsFromHtml(text) {
  var tags = [];
  // Product detail-meta format: 标签：AI视觉 / 摄像头
  var dm = text.match(/<div[^>]*class="[^"]*detail-meta[^"]*"[^>]*>([\s\S]*?)<\/div>/i);
  if (dm) {
    var tagMatch = dm[1].match(/标签[：:]\s*(.+)/i);
    if (tagMatch) {
      tags = tagMatch[1].split(/[\/\s·]+/).map(function(t) { return t.trim(); }).filter(Boolean);
    }
  }
  // Article entry-tags format: <span class="...tag...">text</span>
  if (!tags.length) {
    var m = text.match(/<span[^>]*class="[^"]*tag[^"]*"[^>]*>([\s\S]*?)<\/span>/gi);
    if (m) {
      for (var i = 0; i < m.length; i++) {
        var inner = m[i].replace(/<[^>]+>/g, '').trim();
        if (inner) tags.push(inner);
      }
    }
  }
  return tags;
}

function extractTagsFromMd(text) {
  var tags = [];
  var lines = text.split('\n');
  for (var i = 0; i < lines.length && i < 10; i++) {
    var m = lines[i].match(/^tags:\s*(.+)/i);
    if (m) {
      tags = m[1].split(/[,，]/).map(function(t) { return t.trim(); }).filter(Boolean);
      break;
    }
  }
  return tags;
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  var d = new Date(dateStr);
  if (isNaN(d.getTime())) return '';
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function getItemMeta(file, basePath) {
  basePath = basePath || '/articles/';
  var cacheKey = META_CACHE_VER + ':' + basePath + file.name + '@' + file.mtime;
  if (articleMetaCache[cacheKey]) return Promise.resolve(articleMetaCache[cacheKey]);

  var url = basePath + file.name;
  var isMd = /\.md$/i.test(file.name);
  var isHtml = /\.html?$/i.test(file.name);

  if (!isMd && !isHtml) return Promise.resolve(null);

  return fetch(url, { cache: 'no-store' })
    .then(function(res) {
      if (!res.ok) return null;
      return res.text();
    })
    .then(function(text) {
      if (!text) return null;
      var title = isMd ? extractTitleFromMd(text) : extractTitleFromHtml(text);
      if (!title) title = file.name.replace(/\.(md|html?)$/i, '');
      var tags = isMd ? extractTagsFromMd(text) : extractTagsFromHtml(text);
      var date = formatDate(file.mtime);
      var meta = {
        name: file.name,
        url: basePath + file.name.replace(/\.(md|html?)$/i, ''),
        title: title,
        tags: tags,
        date: date,
        mtime: file.mtime,
        isMd: isMd
      };
      articleMetaCache[cacheKey] = meta;
      return meta;
    });
}

function fetchArticleList() {
  return fetch('/articles-json/', { cache: 'no-store' })
    .then(function(res) {
      if (!res.ok) throw Error('Failed to fetch article list');
      return res.json();
    })
    .then(function(files) {
      // Filter only html/md files, sort by mtime descending
      var articles = files.filter(function(f) {
        return f.type === 'file' && /\.(md|html?)$/i.test(f.name);
      });
      articles.sort(function(a, b) {
        return new Date(b.mtime) - new Date(a.mtime);
      });
      return articles;
    });
}

function renderHomeArticleList(articles) {
  var container = document.getElementById('home-articles');
  if (!container) return;
  if (!articles.length) {
    container.innerHTML = '<p style="color:var(--secondary);text-align:center;padding:20px">暂无文章</p>';
    return;
  }
  Promise.all(articles.map(function(f) { return getItemMeta(f, '/articles/'); })).then(function(metas) {
    var html = '';
    for (var i = 0; i < metas.length; i++) {
      var m = metas[i];
      if (!m) continue;
      var tagsHtml = '';
      if (m.tags && m.tags.length) {
        tagsHtml = '<div class="entry-tags">' + m.tags.map(function(t) {
          return '<span>' + escHtml(t) + '</span>';
        }).join('') + '</div>';
      }
      html += '<a href="' + m.url + '" class="entry-item" style="text-decoration:none;color:inherit;display:flex;">' +
        '<div><div class="entry-title">' + escHtml(m.title) + '</div>' + tagsHtml + '</div>' +
        (m.date ? '<div class="entry-date">' + m.date + '</div>' : '') + '</a>';
    }
    container.innerHTML = html;
  });
}

function renderArticlesPage(container, articles) {

  var grid = document.getElementById('articles-grid');
  if (!articles.length) {

  }
  Promise.all(articles.map(function(f) { return getItemMeta(f, '/articles/'); })).then(function(metas) {
    var placeholders = ['📷','🧠','🌐','🏠','📡','📝','🔧','💡','🎯','🚀','⚡','🔬','📚','🎨'];
    var allMetas = metas.filter(Boolean);

    // Collect unique tags

    // Build tag filter bar
    var filterBar = document.getElementById('articles-tags-filter');

      filterHtml += '<span class="tag-item" data-tag="' + escHtml(allTags[i]) + '">' + escHtml(allTags[i]) + '</span>';
    }
    filterBar.innerHTML = filterHtml;

    function renderGrid(filterTag) {
      var html = '';
      for (var i = 0; i < allMetas.length; i++) {
        var m = allMetas[i];
        if (filterTag && (!m.tags || m.tags.indexOf(filterTag) === -1)) continue;
        var ph = placeholders[i % placeholders.length];
        var desc = m.tags && m.tags.length ? m.tags.join(' · ') : '';
        var tagsHtml = m.tags && m.tags.length ? m.tags.map(function(t) {
          return '<span>' + escHtml(t) + '</span>';
        }).join('') : '';
        html += '<a href="' + m.url + '" class="project-card">' +
          '<div class="card-img-placeholder">' + ph + '</div>' +

          (desc ? '<p>' + escHtml(desc) + '</p>' : '') +
          (tagsHtml ? '<div class="card-tags">' + tagsHtml + '</div>' : '') +
          '</div></a>';
      }
      grid.innerHTML = html || '<p style="color:var(--secondary);text-align:center;padding:20px">' + noMatchMsg + '</p>';
    }

    renderGrid('');

    filterBar.addEventListener('click', function(e) {
      var el = e.target.closest('.tag-item');
      if (!el) return;
      var tag = el.getAttribute('data-tag');
      var items = filterBar.querySelectorAll('.tag-item');
      for (var i = 0; i < items.length; i++) {
        items[i].classList.toggle('active', items[i].getAttribute('data-tag') === tag);
      }
      renderGrid(tag);
    });
  });
}

function renderProductsPage(container, products) {
  var pp = ((window.__P || {}).pages || {}).products || {};

  var emptyMsg = pp.emptyMsg || '暂无产品';
  var noMatchMsg = pp.noMatchMsg || '无匹配产品';
  container.innerHTML = '<div class="page-content"><h1>' + title + '</h1><p>' + subtitle + '</p><div class="tags-cloud" id="products-tags-filter" style="margin-bottom:20px"></div><div class="project-grid" id="products-grid"><p style="color:var(--secondary);text-align:center;padding:20px">加载中...</p></div><a href="/" class="back-link">← 返回首页</a></div>';
  var grid = document.getElementById('products-grid');
  if (!products.length) {
    grid.innerHTML = '<p style="color:var(--secondary);text-align:center;padding:20px">' + emptyMsg + '</p>';
    return;
  }
  Promise.all(products.map(function(f) { return getItemMeta(f, '/products/'); })).then(function(metas) {
    var placeholders = ['🔧','📸','🖥️','📊','🤖','🔌','📡','🎛️','💻','⚙️','🛠️','🔬'];
    var allMetas = metas.filter(Boolean);

    var tagMap = {};
    for (var i = 0; i < allMetas.length; i++) {
      var t = allMetas[i].tags;
      if (t) { for (var j = 0; j < t.length; j++) { tagMap[t[j]] = true; } }
    }
    var allTags = Object.keys(tagMap).sort();

    var filterBar = document.getElementById('products-tags-filter');
    var filterHtml = '<span class="tag-item active" data-tag="">全部</span>';
    for (var i = 0; i < allTags.length; i++) {
      filterHtml += '<span class="tag-item" data-tag="' + escHtml(allTags[i]) + '">' + escHtml(allTags[i]) + '</span>';
    }
    filterBar.innerHTML = filterHtml;

    function renderGrid(filterTag) {
      var html = '';
      for (var i = 0; i < allMetas.length; i++) {
        var m = allMetas[i];
        if (filterTag && (!m.tags || m.tags.indexOf(filterTag) === -1)) continue;
        var ph = placeholders[i % placeholders.length];
        var desc = m.tags && m.tags.length ? m.tags.join(' · ') : '';
        var tagsHtml = m.tags && m.tags.length ? m.tags.map(function(t) {
          return '<span>' + escHtml(t) + '</span>';
        }).join('') : '';
        html += '<a href="' + m.url + '" class="project-card">' +
          '<div class="card-img-placeholder">' + ph + '</div>' +
          '<div class="card-body"><h3>' + escHtml(m.title) + '</h3>' +
          (desc ? '<p>' + escHtml(desc) + '</p>' : '') +
          (tagsHtml ? '<div class="card-tags">' + tagsHtml + '</div>' : '') +
          '</div></a>';
      }
      grid.innerHTML = html || '<p style="color:var(--secondary);text-align:center;padding:20px">' + noMatchMsg + '</p>';
    }

    renderGrid('');

    filterBar.addEventListener('click', function(e) {
      var el = e.target.closest('.tag-item');
      if (!el) return;
      var tag = el.getAttribute('data-tag');
      var items = filterBar.querySelectorAll('.tag-item');
      for (var i = 0; i < items.length; i++) {
        items[i].classList.toggle('active', items[i].getAttribute('data-tag') === tag);
      }
      renderGrid(tag);
    });
  });
}

// ========== SPA-style page loading ==========

document.addEventListener('click', function(e) {
  var link = e.target.closest('a');
  if (!link) return;
  var href = link.getAttribute('href');
  if (!href || href.startsWith('http') || href.startsWith('#') || href.startsWith('mailto:') || link.target === '_blank') return;

  e.preventDefault();
  var path = href.replace(/\/$/, '') || '/';

  document.querySelectorAll('#menu a').forEach(function(a) {
    a.classList.toggle('active', a.getAttribute('href') === href);
  });

  var main = document.querySelector('.main');
  if (path === '/') {
    window.history.pushState({page:'home'}, '', '/');
    window.location.href = '/';
  } else {
    window.history.pushState({page:path}, '', path);
    loadPage(path, main);
  }
});

function loadPage(path, container) {
  function show404() {
    container.innerHTML = '<div class="page-content"><h1>404</h1><p>页面未找到。</p><a href="/" class="back-link">← 返回首页</a></div>';
  }

  function renderMd(md) {
    container.innerHTML = '<div class="page-content">' + parseMarkdown(md) + '<a href="/" class="back-link">← 返回首页</a></div>';
  }

  function isIndexHtml(text) {
    return /^\s*<!DOCTYPE\s|<html/i.test(text.trim());
  }

  // Articles listing page - dynamic
  if (path === '/articles') {
    var aParams = ((window.__P || {}).pages || {}).articles || {};
    var aTitle = aParams.title || '📝 文章';
    var aEmpty = aParams.emptyMsg || '暂无文章。';
    container.innerHTML = '<div class="page-content"><h1>' + aTitle + '</h1><p style="color:var(--secondary);text-align:center;padding:20px">加载中...</p></div>';
    fetchArticleList().then(function(articles) {
      if (!articles.length) {
        container.innerHTML = '<div class="page-content"><h1>' + aTitle + '</h1><p>' + aEmpty + '</p><a href="/" class="back-link">← 返回首页</a></div>';
        return;
      }
      renderArticlesPage(container, articles);
    }).catch(function() {
      container.innerHTML = '<div class="page-content"><h1>' + aTitle + '</h1><p>加载失败。</p><a href="/" class="back-link">← 返回首页</a></div>';
    });
    return;
  }

  // Products listing page - dynamic
  if (path === '/products') {
    var pParams = ((window.__P || {}).pages || {}).products || {};
    var pTitle = pParams.title || '🛒 产品';
    var pEmpty = pParams.emptyMsg || '暂无产品。';
    container.innerHTML = '<div class="page-content"><h1>' + pTitle + '</h1><p style="color:var(--secondary);text-align:center;padding:20px">加载中...</p></div>';
    fetchProductList().then(function(products) {
      if (!products.length) {
        container.innerHTML = '<div class="page-content"><h1>' + pTitle + '</h1><p>' + pEmpty + '</p><a href="/" class="back-link">← 返回首页</a></div>';
        return;
      }
      renderProductsPage(container, products);
    }).catch(function() {
      container.innerHTML = '<div class="page-content"><h1>' + pTitle + '</h1><p>加载失败。</p><a href="/" class="back-link">← 返回首页</a></div>';
    });
    return;
  }

  // About page - dynamic from param.json
  if (path === '/about') {
    var ab = ((window.__P || {}).aboutPage) || {};
    var abTitle = ab.title || '🙋 关于';
    var s = (window.__P || {}).social || {};
    var html = '<div class="page-content"><h1>' + abTitle + '</h1>';
    if (ab.content) {
      html += ab.content;
    } else {
      html += '<p>geekegret 工作室致力于嵌入式 Linux 与 AIoT 领域的探索与实践。</p>';
      html += '<p>我们基于 <strong>Rockchip RV1106</strong> 平台，研究边缘计算、智能视觉、轻量 Web 服务等技术方向。</p>';
      html += '<h2>联系方式</h2><ul>';
      if (s.github) html += '<li>GitHub: <a href="' + s.github + '" target="_blank">@' + escHtml(s.github.replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, '')) + '</a></li>';
      if (s.email) html += '<li>Email: ' + escHtml(s.email.replace(/^mailto:/, '')) + '</li>';
      html += '</ul>';
    }
    html += '<a href="/" class="back-link">← 返回首页</a></div>';
    container.innerHTML = html;
    return;
  }

  // Contact page - dynamic from param.json
  if (path === '/contact') {
    var ct = ((window.__P || {}).contactPage) || {};
    var ctTitle = ct.title || '📬 联系';
    var s = (window.__P || {}).social || {};
    var githubUser = (s.github || '').replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, '');
    var html = '<div class="page-content"><h1>' + ctTitle + '</h1>';
    if (ct.content) {
      html += ct.content;
    } else {
      html += '<p>欢迎通过以下方式与我们取得联系：</p><ul>';
      if (s.github) html += '<li><strong>GitHub:</strong> <a href="' + s.github + '" target="_blank">@' + escHtml(githubUser) + '</a></li>';
      if (s.email) html += '<li><strong>Email:</strong> <a href="' + s.email + '">' + escHtml(s.email.replace(/^mailto:/, '')) + '</a></li>';
      html += '</ul><p>或在本站提交 Issue / PR 参与讨论。</p>';
    }
    html += '<a href="/" class="back-link">← 返回首页</a></div>';
    container.innerHTML = html;
    return;
  }

  // Explicit .md file — strip extension and re-route via SPA
  if (/\.md$/.test(path)) {
    var cleanPath = path.replace(/\.md$/, '');
    window.history.replaceState({page:cleanPath}, '', cleanPath);
    loadPage(cleanPath, container);
    return;
  }

  // Try .md first, then .html
  function tryMd(cb) {
    fetch(path + '.md', { cache: 'no-store' })
      .then(function(r) { if (!r.ok) throw Error(); return r.text(); })
      .then(function(text) {
        if (isIndexHtml(text)) throw Error();
        renderMd(text);
        if (cb) cb();
      })
      .catch(function() { if (cb) cb(); });
  }

  var url = /\.html$/.test(path) ? path : path + '.html';
  fetch(url, { cache: 'no-store' })
    .then(function(res) {
      if (!res.ok) throw Error();
      return res.text().then(function(html) {
        if (isIndexHtml(html)) { tryMd(); return; }
        container.innerHTML = html;
      });
    })
    .catch(function() { tryMd(show404); });
}

// Handle browser back/forward
window.addEventListener('popstate', function(e) {
  if (e.state && e.state.page) {
    var path = e.state.page;
    var main = document.querySelector('.main');
    if (path === 'home') {
      window.location.href = '/';
    } else {
      document.querySelectorAll('#menu a').forEach(function(a) {
        a.classList.toggle('active', a.getAttribute('href') === path);
      });
      loadPage(path, main);
    }
  }
});

// Init: route to current URL on page load / refresh
(function initRoute() {
  var path = window.location.pathname.replace(/\/$/, '');
  if (!path || path === '/index.html') path = '/';

  // Highlight nav
  document.querySelectorAll('#menu a').forEach(function(a) {
    a.classList.toggle('active', a.getAttribute('href') === path);
  });

  // Load home articles
  fetchArticleList().then(function(articles) {
    var maxCount = (((window.__P || {}).pages || {}).home || {}).maxArticles || 6;
    renderHomeArticleList(articles.slice(0, maxCount));
  }).catch(function() {
    var c = document.getElementById('home-articles');
    if (c) c.innerHTML = '<p style="color:var(--secondary);text-align:center;padding:20px">加载失败</p>';
  });

  // If not home page, load the requested page after params are ready
  if (path !== '/') {
    var main = document.querySelector('.main');
    (window.__P_ready || Promise.resolve()).then(function() {
      // Re-highlight in case nav was rebuilt by param loader
      document.querySelectorAll('#menu a').forEach(function(a) {
        a.classList.toggle('active', a.getAttribute('href') === path);
      });
      loadPage(path, main);
    });
  }
})();
</script>
